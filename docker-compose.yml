services:
  app:
    container_name: barber_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:g8eODPeAoW/KauNo/Wm90XLMj8Y5o7l0DksWmRnhVsw=
      APP_URL: https://api-atendimento.syntaxatendimento.com.br
      FRONTEND_URL: https://syntaxatendimento.com.br
      CORS_ALLOWED_ORIGINS: https://syntaxatendimento.com.br,https://www.syntaxatendimento.com.br,http://192.168.18.97:4002,http://localhost:4002,http://127.0.0.1:4002
      SANCTUM_STATEFUL_DOMAINS: syntaxatendimento.com.br,www.syntaxatendimento.com.br,192.168.18.97:4002,localhost:4002,127.0.0.1:4002
      SESSION_DOMAIN: null
      MERCADO_PAGO_CONNECT_REDIRECT_URI: https://api-atendimento.syntaxatendimento.com.br/api/integrations/mercado-pago/oauth/callback
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: barber
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file

  db:
    image: mysql:8.0
    container_name: barber_mysql
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barber
    volumes:
      - barber_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: [whatsapp]
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      SERVER_URL: http://evolution:8080
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-}@evolution-postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: syntax-evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15-alpine
    profiles: [whatsapp]
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 20

  evolution-redis:
    image: redis:7-alpine
    profiles: [whatsapp]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  barber_db_data:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
